[mod-name]
thruster-upgrades=Thruster Upgrades

[mod-description]
thruster-upgrades=This mod adds two balanced higher tier thrusters with enhanced efficiency, larger fuel storages and significantly more thrust (M2 for mid-game and M3 for late-game). Thruster upgrades can be unlocked before Aquilo.

