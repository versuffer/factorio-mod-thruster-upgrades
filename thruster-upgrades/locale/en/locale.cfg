[recipe-name]
thruster-mk2=Thruster MK2
thruster-mk3=Thruster MK3

[recipe-description]
thruster-mk2=Next generation of chemical combustion thruster. Provides more efficient fuel usage, larger fuel storage and possibility to burn more fuel near maximum filling.
thruster-mk3=The last and superior generation of chemical combustion thruster. Enhanced and polished version of previous generation.

[technology-name]
thruster-mk2=Thruster MK2
thruster-mk3=Thruster MK3

[technology-description]
thruster-mk2=Unlocks the ability to construct more robust, powerful and efficient chemical combustion thrusters that can burn significant amounts of fuel.
thruster-mk3=Unlocks the ability to construct the most robust, powerful and efficient chemical combustion thrusters that can burn immense amounts of fuel.

[entity-description]
thruster-mk2=Constructed with tungsten to endure high temperatures during fuel combustion that allows burning more fuel at once. Uses productivity modules to increase amount of burning fuel and efficiency modules to burn fuel more effectively.
thruster-mk3=Upgraded version of second generation thruster. Also uses holmium to stabilize work of electronic components of thruster during takeoff acceleration stage and make them more persistent to high temperatures. This approach allows to reach the peak of chemical combustion technologies for space traveling.
