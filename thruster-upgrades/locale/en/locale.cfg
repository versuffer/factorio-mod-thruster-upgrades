[mod-name]
thruster-upgrades=Thruster Upgrades

[mod-description]
thruster-upgrades=Adds two balanced higher tier thrusters with enhanced efficiency, larger fuel storages and significantly more thrust (MK2 for mid-game and MK3 for late-game). Thruster upgrades can be unlocked before Aquilo. You can also make thrusters symmetric and increase thruster fuel/oxidizer fuel value to get more thrust.

[entity-name]
thruster-mk2=Thruster MK2
thruster-mk3=Thruster MK3

[recipe-name]
thruster-mk2=Thruster MK2
thruster-mk3=Thruster MK3

[recipe-description]
thruster-mk2=Next generation of chemical combustion thruster. Provides more efficient fuel usage, larger fuel storage and possibility to burn more fuel near maximum filling.
thruster-mk3=The last and superior generation of chemical combustion thruster. Enhanced and polished version of previous generation.

[technology-name]
thruster-mk2=Thruster MK2
thruster-mk3=Thruster MK3

[technology-description]
thruster-mk2=Unlocks the ability to construct more robust, powerful and efficient chemical combustion thrusters that can burn significant amounts of fuel.
thruster-mk3=Unlocks the ability to construct the most robust, powerful and efficient chemical combustion thrusters that can burn immense amounts of fuel.

[entity-description]
thruster-mk2=Constructed with tungsten and carbon fiber to endure high temperatures during fuel combustion that allows burning more fuel at once. Uses productivity modules to increase amount of burning fuel and efficiency modules to burn fuel more effectively.
thruster-mk3=Upgraded version of second generation thruster. Also uses supercapacitors to enhance fuel burning control system. This approach allows to reach the peak of chemical combustion technologies for space traveling.

[mod-setting-name]
thruster-upgrades-enable-thruster-fluid-box-symmetry=Enable thruster fluid box symmetry
thruster-upgrades-enable-thruster-fuel-oxidizer-fuel-value-adjustment=Enable thruster fuel/oxidizer fuel value adjustment
thruster-upgrades-thruster-fuel-oxidizer-fuel-value-kj=Thruster fuel/oxidizer fuel value, kJ
thruster-upgrades-enable-nested-recipes=Enable nested recipes

thruster-upgrades-thruster-mk2-full-storage-efficiency-percent=Thruster [color=#00a3f3][font=heading-2]MK2[/font][/color] full storage efficiency, percent
thruster-upgrades-thruster-mk2-full-storage-fluid-usage-percent=Thruster [color=#00a3f3][font=heading-2]MK2[/font][/color] full storage fluid usage, percent
thruster-upgrades-thruster-mk2-storage-volume-units=Thruster [color=#00a3f3][font=heading-2]MK2[/font][/color] fuel/oxidizer storage volume, units

thruster-upgrades-thruster-mk3-full-storage-efficiency-percent=Thruster [color=#ff1313][font=heading-2]MK3[/font][/color] full storage efficiency, percent
thruster-upgrades-thruster-mk3-full-storage-fluid-usage-percent=Thruster [color=#ff1313][font=heading-2]MK3[/font][/color] full storage fluid usage, percent
thruster-upgrades-thruster-mk3-storage-volume-units=Thruster [color=#ff1313][font=heading-2]MK3[/font][/color] fuel/oxidizer storage volume, units


[mod-setting-description]
thruster-upgrades-enable-thruster-fluid-box-symmetry=Make Thruster, Thruster MK2 and Thruster MK3 fluid boxes vertically symmetrical.
thruster-upgrades-enable-thruster-fuel-oxidizer-fuel-value-adjustment=This setting allows you to enable thruster fuel/oxidizer energy capacity adjustment. Increasing fuel value leads to getting more thrust from the same amount of fuel/oxidizer burned.
thruster-upgrades-thruster-fuel-oxidizer-fuel-value-kj=WARNING! Fuel value adjustment can increase thrust SIGNIFICANTLY! Be careful when setting fuel value above 100 kJ. For example, if you want to get 2x more thrust, set 50 * 2 = 100 kJ.
thruster-upgrades-enable-nested-recipes=Make Thruster MK2 and Thruster MK3 recipes require previous thruster item to apply.

thruster-upgrades-thruster-mk2-full-storage-efficiency-percent=Percent of burned fuel energy transformed into thrust when fluid storages are full (see "Thruster perfomance curves").
thruster-upgrades-thruster-mk2-full-storage-fluid-usage-percent=Default 100% fluid usage is 60 units/s (fixed in-game value that can be changed only with quality upgrade). This setting allows you to modify the "ceiling" of thruster consumption range in percents relatively to default fluid usage. Example: 340% fluid usage = 60 * 3.4 = 204 units/s.

thruster-upgrades-thruster-mk3-full-storage-efficiency-percent=Percent of burned fuel energy transformed into thrust when fluid storages are full (see "Thruster perfomance curves").
thruster-upgrades-thruster-mk3-full-storage-fluid-usage-percent=Default 100% fluid usage is 60 units/s (fixed in-game value that can be changed only with quality upgrade). This setting allows you to modify the "ceiling" of thruster consumption range in percents relatively to default fluid usage. Example: 500% fluid usage = 60 * 5 = 300 units/s.
